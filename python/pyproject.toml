[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-heb-rivok"
version = "1.0.1"
description = "heb_rivok and heb_rivok_lite: Tesseract models for printed Hebrew (with English and digits), installable with pip"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rivok Labs" }]
keywords = ["tesseract", "ocr", "hebrew", "traineddata", "tessdata", "ocrmypdf", "pytesseract"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Hebrew",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RivoksLab/tesseract-heb-rivok"
Repository = "https://github.com/RivoksLab/tesseract-heb-rivok"
Issues = "https://github.com/RivoksLab/tesseract-heb-rivok/issues"
"Hugging Face" = "https://huggingface.co/Rivok/tesseract-heb-rivok"
"Write-up" = "https://rivoklabs.com/research/tesseract-hebrew"

[project.scripts]
tesseract-heb-rivok = "tesseract_heb_rivok.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tesseract_heb_rivok = ["tessdata/*.traineddata"]
